name: Refresh data and analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "report/build_report.py", "report/report_template.tex", "requirements.txt", ".github/workflows/pipeline.yml"]
  schedule:
    - cron: "17 9 * * 1"   # every Monday, after EIA's weekend updates

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests on synthetic data
        run: python -m pytest -q
      - name: Download EIA-930 data
        run: python src/fetch_data.py
      - name: Run analysis
        run: python src/analysis.py
      - name: Build the technical report (LaTeX)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended fonts-texgyre
          python report/build_report.py
      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/fetch_log.json docs/data docs/report.pdf report
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh EIA data and results"
            git pull --rebase origin main
            git push
          fi
