name: Refresh data and analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "requirements.txt", ".github/workflows/pipeline.yml"]
  schedule:
    - cron: "17 9 * * 1"   # every Monday, after EIA's weekend updates

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download EIA-930 data
        run: python src/fetch_data.py
      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh EIA data and results"
            git pull --rebase origin main
            git push
          fi
